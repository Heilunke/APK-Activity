name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.14.2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2

      # Android SDK (already on GitHub's computer, just add API 36)
      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create cordova-app com.peralta.noteapp "Note App"
          cd cordova-app
          cordova platform add android

      - name: Copy app files into www
        run: |
          rm -rf cordova-app/www/*
          cp index.html app.js cordova-app/www/
          test -f cordova-app/www/index.html || (echo "ERROR: index.html not found in repo root" && exit 1)

      # Put Ionic inside the app so it works even without internet
      - name: Bundle Ionic into the app
        run: |
          npm pack @ionic/core@8.8.19
          tar xzf ionic-core-8.8.19.tgz
          mkdir -p cordova-app/www/lib/ionic/css
          cp -r package/dist/ionic cordova-app/www/lib/ionic/dist
          cp package/css/ionic.bundle.css cordova-app/www/lib/ionic/css/

      - name: Build the APK
        run: |
          cd cordova-app
          cordova requirements
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: note-app-apk
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
